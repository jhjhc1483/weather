<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="양평, 경산, 사천, 함안, 성주, 세종, 계룡, 임실 8개 지역 실시간 기상예보 대시보드">
  <title>기상예보 대시보드</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <header class="header" id="header">
      <h1 class="title" id="main-title">기상예보</h1>
      <div class="meta-row">
        <span class="badge time-badge" id="time-display">--:-- 기준</span>
        
        <!-- 갱신 버튼 -->
        <button class="refresh-btn" id="refresh-btn" title="지금 데이터 갱신 요청">
          <svg class="refresh-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="btn-text">지금 갱신</span>
        </button>

        <!-- 테마 전환 버튼 (우측 상단 동그란 아이콘 버튼) -->
        <button class="theme-toggle-btn" id="theme-toggle-btn" title="다크 / 라이트 모드 전환" aria-label="테마 전환">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 테이블 영역 -->
    <div class="table-card">
      <div class="table-wrapper">
        <table id="weather-table">
          <thead>
            <tr>
              <th class="th-cat" colspan="2">구분</th>
              <th class="th-loc">양평</th>
              <th class="th-loc">경산</th>
              <th class="th-loc">사천</th>
              <th class="th-loc">함안</th>
              <th class="th-loc">성주</th>
              <th class="th-loc">세종</th>
              <th class="th-loc">계룡</th>
              <th class="th-loc">임실</th>
            </tr>
          </thead>
          <tbody id="weather-body">
            <tr>
              <td colspan="10" class="loading-cell">
                <div class="loading-spinner"></div>
                <span>데이터를 불러오는 중...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 푸터 -->
    <footer class="footer">
      <p>데이터 출처: 기상청 · 에어코리아 &nbsp;|&nbsp; 2시간 간격 자동 갱신</p>
      <p class="copyright">Copyright © Maj.cjh All rights reserved.</p>
    </footer>
  </div>

  <!-- 우측 하단 README 플로팅 버튼 -->
  <button id="readme-btn" class="readme-btn" title="프로젝트 안내 (README)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
    </svg>
    <span>README</span>
  </button>

  <!-- README 모달 팝업 -->
  <div id="readme-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title-text">📖 프로젝트 안내 (README)</h2>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading-cell">
          <div class="loading-spinner"></div>
          <span>README를 불러오는 중...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 알림 -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>

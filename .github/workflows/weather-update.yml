name: Update Weather Data

on:
  schedule:
    - cron: '30 */1 * * *'   # 1시간 간격 (매 1시간 30분 UTC/KST)
  workflow_dispatch:         # 수동 트리거 (지금 갱신 버튼)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch weather data
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_weather.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          git diff --quiet --cached || git commit -m "chore: update weather data $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push

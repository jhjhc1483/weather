name: 기상자료 수집

on:
  schedule:
    - cron: "5 * * * *"      # 매시 05분(UTC=KST 기준으로도 매시 05분). 부하에 따라 5~30분 지연될 수 있음
  workflow_dispatch:          # 수동 실행 + 사이트의 [지금 갱신] 버튼이 호출하는 트리거
  push:
    paths: [regions.json, collector.py]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # cache: pip 은 일부러 뺐습니다. requirements.txt 를 못 찾으면
          # 캐시 단계에서 워크플로 전체가 실패합니다. 설치할 게 requests 하나라 이득도 없습니다.

      - name: 파일 확인
        run: |
          echo "작업 경로: $(pwd)"
          ls -la
          test -f requirements.txt || { echo "::error::requirements.txt 가 저장소에 없습니다. 커밋했는지 확인하세요."; exit 1; }
          test -f collector.py     || { echo "::error::collector.py 가 저장소에 없습니다."; exit 1; }

      - run: pip install -r requirements.txt

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect.py

      - name: 결과 커밋
        run: |
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add public/data.json state/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "기상자료 $(TZ=Asia/Seoul date +'%m.%d %H:%M KST')"
            git push
          fi
